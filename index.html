<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hollow Cathedral</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Noto+Sans:wght@400;600;700&amp;family=Noto+Serif:wght@600;700&amp;display=swap">
<style>
body{margin:0;background:#0b0809}
.lr, .lr *{box-sizing:border-box}
.lr:focus{outline:none}
.lr-btn{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:2px solid #c9a24a;background:#2a1c1a;color:#f0e3c0;padding:0 12px;min-height:44px;line-height:1}
.lr-btn:hover{background:#3a2420}
.lr-btn:focus-visible{outline:3px solid #9ad0b5;outline-offset:2px}
.lr-btn[disabled]{cursor:not-allowed;border-color:#5a3a38;color:#8f8070;background:#1c1312}
.lr-primary{background:#c9a24a;color:#15100f;border-color:#c9a24a;font-size:18px;min-height:52px;padding:0 28px}
.lr-primary:hover{background:#ddb862}
.lr-key{display:inline-block;min-width:24px;padding:3px 6px;border:2px solid #6a4a44;border-bottom-width:4px;background:#231716;color:#e9e0d0;font-size:12px;text-align:center;line-height:1}
.lr-scroll::-webkit-scrollbar{width:8px}
@keyframes lrSlide{from{transform:translateX(70px);opacity:0}to{transform:none;opacity:1}}
.lr-slot{transition:transform .12s, box-shadow .12s}.lr-slot:hover{transform:scale(1.07)}
.lr-scroll::-webkit-scrollbar-thumb{background:#5a3a38}
</style>

<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b0809}#stage{position:absolute;left:0;top:0;width:1180px;height:700px;transform-origin:0 0}</style>
</head><body>
<div id="stage"><div id="app"></div></div>
<template id="tpl">

<div class="lr" tabindex="0" id="lr-wrap" ref="{{ wrapRef }}" onKeyDown="{{ onKeyDown }}" onKeyUp="{{ onKeyUp }}" onBlur="{{ onBlur }}" style="position: relative; width: 1180px; height: 700px; padding: 20px; display: flex; gap: 20px; background: #0b0809; color: #e9e0d0; font-family: 'Noto Sans', 'Segoe UI', Arial, sans-serif; font-size: 14px;">

<div style="width: 800px; display: flex; flex-direction: column; gap: 12px; min-height: 0">
<div style="height: 44px; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: Cinzel, serif; font-size: 26px; font-weight: 700; color: #c9a24a; line-height: 1; letter-spacing: 1px">Hollow Cathedral</div>
<div style="font-size: 12px; color: #a89a8c; line-height: 1">Explore the castle: keys, relics, secrets, and a saint to fell.</div>
</div>
<div style="width: 500px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px 12px; align-items: center; font-size: 12px; color: #d8cbb8">
<span><span class="lr-key">A</span> <span class="lr-key">D</span> move</span>
<span><span class="lr-key">W</span> <span class="lr-key">Space</span> jump · door</span>
<span><span class="lr-key">J</span> sword</span>
<span><span class="lr-key">K</span> <span class="lr-key">L</span> <span class="lr-key">I</span> skills</span>
<span><span class="lr-key">E</span> <span class="lr-key">1-4</span> weapon</span>
<span><span class="lr-key">Tab</span> character</span>
<span><span class="lr-key">T</span> tame</span>
<span><span class="lr-key">P</span> pet</span>
<span><span class="lr-key">Q</span> potion</span>
</div>
</div>

<div style="position: relative; width: 800px; height: 450px; box-shadow: 0 0 0 2px #4a2a2a; background: #0d0809">
<canvas id="lr-canvas" ref="{{ canvasRef }}" width="800" height="450" style="display: block; width: 800px; height: 450px"></canvas>

<div style="position: absolute; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 6px; padding: 8px 10px; background: rgba(11,8,9,0.78); width: 220px">
<div style="display: flex; justify-content: space-between; font-size: 14px; font-weight: 700"><span>LV {{ level }}</span><span style="color: #e8808a">HP {{ hpText }}</span></div>
<div style="height: 12px; background: #2a1c1a"><div style="height: 12px; background: #c4303c; width: {{ hpW }}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #a89a8c"><span>XP</span><span>{{ xpText }}</span></div>
<div style="height: 6px; background: #2a1c1a"><div style="height: 6px; background: #9ad0b5; width: {{ xpW }}"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #a89a8c"><span>MP · {{ subName }}</span><span>{{ mpText }}</span></div>
<div style="height: 6px; background: #2a1c1a"><div style="height: 6px; background: #6ab7ff; width: {{ mpW }}"></div></div>
</div>


<div style="position: absolute; left: 12px; top: 136px; display: flex; flex-direction: column; gap: 4px; width: 220px">
<sc-for list="{{ skills }}" as="k" hint-placeholder-count="3">
<div style="position: relative; display: flex; align-items: center; gap: 8px; padding: 4px 8px; background: rgba(11,8,9,0.78); overflow: hidden; border-left: 3px solid {{ k.col }}">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ k.cdW }}; background: rgba(120,40,40,0.55)"></div>
<span class="lr-key" style="position: relative">{{ k.key }}</span>
<span style="position: relative; flex: 1; font-size: 13px; font-weight: 600; line-height: 1.1; color: {{ k.tc }}">{{ k.name }}</span>
<span style="position: relative; font-size: 12px; color: #6ab7ff">{{ k.cost }}</span>
</div>
</sc-for>
</div>

<sc-if value="{{ hasPet }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 12px; top: 236px; width: 220px; padding: 5px 8px; background: rgba(11,8,9,0.78); border-left: 3px solid #ffb7d0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; font-size: 13px; font-weight: 600"><span style="color: #ffb7d0">♥ {{ petName }}</span><span>Lv {{ petLv }}</span></div>
<div style="height: 4px; background: #2a1c1a"><div style="height: 4px; background: #ffb7d0; width: {{ petXpW }}"></div></div>
</div>
</sc-if>

<div style="position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; font-size: 14px; font-weight: 700">
<div style="padding: 6px 10px; background: rgba(11,8,9,0.78)">{{ roomName }}</div>
<div style="padding: 6px 10px; background: rgba(11,8,9,0.78); color: #ffd166">{{ gold }} GOLD</div>
<div style="padding: 6px 10px; background: rgba(11,8,9,0.78)">POTIONS {{ potions }}</div>
</div>

<sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; right: 0; bottom: 16px; display: flex; justify-content: center; pointer-events: none">
<div style="padding: 8px 14px; background: rgba(11,8,9,0.88); border: 2px solid #c9a24a; font-size: 15px; font-weight: 600; color: #f0e3c0">{{ msg }}</div>
</div>
</sc-if>

<sc-if value="{{ isTitle }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,8,9,0.86)">
<div style="width: 540px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div style="font-family: Cinzel, serif; font-size: 44px; font-weight: 700; color: #c9a24a; line-height: 1.1; letter-spacing: 2px">Hollow Cathedral</div>
<div style="font-size: 16px; color: #e4d8c4; line-height: 1.4">A ruined cathedral of linked rooms. Find the Red Key, claim the Wing Sigil, break hidden walls, rest at altars, and fell the Weeping Saint.</div>
<div style="font-size: 14px; color: #a89a8c; line-height: 1.5">Enemies give XP. Gear drops from foes, chests and candles. Press W or Up at an archway to pass through.</div>
<sc-if value="{{ hasSave }}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<button class="lr-btn lr-primary" onClick="{{ continueGame }}">Continue</button>
<div style="font-size: 13px; color: #9ad0b5">{{ saveInfo }}</div>
</div>
</sc-if>
<button class="lr-btn" onClick="{{ primary }}">New game</button>
<div style="display: flex; gap: 8px">
<button class="lr-btn" style="min-height: 32px; padding: 0 10px; font-size: 12px" onClick="{{ pasteSave }}">Paste save code</button>
</div>
<div style="font-size: 12px; color: #a89a8c; line-height: 1.4">Light an altar to save. Progress is stored in this browser; use the Character window (Tab) to copy a save code for another device.</div>
<div style="font-size: 12px; color: #a89a8c">Click the game once if the keys do not respond.</div>
</div>
</div>
</sc-if>

<sc-if value="{{ isDead }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,8,9,0.86)">
<div style="width: 440px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
<div style="font-size: 40px; font-weight: 700; color: #e8808a; line-height: 1">The lantern went out</div>
<div style="font-size: 16px; color: #e4d8c4; line-height: 1.4">You keep your level, gear, relics and gold. Wake at the last altar you lit.</div>
<button class="lr-btn lr-primary" onClick="{{ primary }}">Return to the altar</button>
</div>
</div>
</sc-if>

<sc-if value="{{ isClear }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; background: rgba(11,8,9,0.92)">
<div style="width: 600px; max-height: 420px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
<div style="font-size: 30px; font-weight: 700; color: #9ad0b5; line-height: 1.1">{{ clearTitle }}</div>
<div style="display: flex; gap: 28px; align-items: center; justify-content: center">
<div style="font-size: 54px; font-weight: 700; color: #ffd166; line-height: 1">{{ clearGrade }}</div>
<div style="text-align: left"><div style="font-size: 12px; color: #a89a8c">FINAL SCORE</div><div style="font-size: 30px; font-weight: 700; color: #ffd166; line-height: 1">{{ clearScore }}</div></div>
<div style="text-align: left"><div style="font-size: 12px; color: #a89a8c">CLEAR TIME · CYCLE {{ clearCycle }}</div><div style="font-size: 24px; font-weight: 700; color: #e4d8c4; line-height: 1.1">{{ clearTime }}</div><div style="font-size: 12px; color: #a89a8c">total {{ clearTotalTime }}</div></div>
</div>
<div style="width: 100%; flex: 1; min-height: 0; max-height: 236px; overflow-y: auto; border: 2px solid #4a2a2a; background: #110c0b; padding: 8px 12px; text-align: left">
<sc-for list="{{ clearLines }}" as="l" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; padding: 3px 0; border-bottom: 1px solid #2a1c1a"><div style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px; line-height: 1.25"><span style="color: {{ l.col }}">{{ l.l }}</span><span style="color: #ffd166; font-weight: 700">{{ l.v }}</span></div><div style="font-size: 11px; color: #8a7d70; line-height: 1.2">{{ l.sub }}</div></div>
</sc-for>
</div>
<button class="lr-btn lr-primary" onClick="{{ primary }}">Begin a harder cycle</button>
</div>
</div>
</sc-if>
</div>

<div style="flex: 1; min-height: 0; border: 2px solid #4a2a2a; background: #110c0b; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden">
<div style="font-size: 12px; color: #a89a8c; line-height: 1">ADVENTURE LOG</div>
<sc-for list="{{ log }}" as="l" hint-placeholder-count="4">
<div style="font-size: 13px; line-height: 1.25; color: {{ l.col }}">{{ l.text }}</div>
</sc-for>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 14px; background: #15100f; border: 2px solid #4a2a2a">

<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 22px; font-weight: 700; color: #c9a24a; line-height: 1">Pilgrim Knight</div>
<div style="font-size: 18px; font-weight: 700; line-height: 1">Lv {{ level }}</div>
</div>
<div style="height: 8px; background: #2a1c1a"><div style="height: 8px; background: #9ad0b5; width: {{ xpW }}"></div></div>
<div style="font-size: 12px; color: #a89a8c; line-height: 1">XP {{ xpText }}</div>
<div style="font-size: 12px; color: #d8cbb8; line-height: 1.2">Relics: {{ relics }}</div>
<div style="font-size: 12px; color: #cfe8ff; line-height: 1.2">Weapons: {{ weaponsText }}</div>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="8">
<div style="padding: 6px 4px; background: #231716; text-align: center; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 12px; color: #a89a8c; line-height: 1">{{ s.label }}</div>
<div style="font-size: 16px; font-weight: 700; line-height: 1">{{ s.value }}</div>
</div>
</sc-for>
</div>

<div style="font-size: 12px; color: #ffd89a; line-height: 1.25; padding: 5px 6px; background: #1c1312">{{ skillText }}<br><span style="color: #a89a8c">{{ skillReq }}</span></div>

<div style="display: flex; gap: 6px">
<button class="lr-btn" style="flex: 1; min-height: 38px; font-size: 13px; background: {{ eqBg }}" onClick="{{ goEq }}">Equipment</button>
<button class="lr-btn" style="flex: 1; min-height: 38px; font-size: 13px; padding: 0 4px; background: {{ packBg }}" onClick="{{ goPack }}">Pack {{ packCount }}/{{ packMax }}</button>
<button class="lr-btn" style="flex: 1; min-height: 38px; font-size: 13px; padding: 0 4px; background: {{ petsBg }}" onClick="{{ goPets }}">Pets {{ petCount }}/{{ petMax }}</button>
</div>

<sc-if value="{{ tabEq }}" hint-placeholder-val="{{ true }}">
<div class="lr-scroll" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px">
<sc-for list="{{ slots }}" as="s" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #231716; min-height: 50px">
<div style="width: 26px; height: 26px; flex: none; color: {{ s.col }}">
<img src="{{ s.img }}" width="34" height="34" style="display:block;image-rendering:auto" alt="">
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 12px; color: #a89a8c; line-height: 1.1">{{ s.label }}<span style="color: {{ s.col }}"> {{ s.rar }}</span></div>
<div style="font-size: 14px; font-weight: 600; line-height: 1.15; color: {{ s.col }}">{{ s.name }}</div>
<div style="font-size: 12px; color: #d8cbb8; line-height: 1.2">{{ s.desc }}</div>
</div>
<sc-if value="{{ s.has }}" hint-placeholder-val="{{ true }}">
<button class="lr-btn" style="min-height: 40px; padding: 0 8px; font-size: 12px" onClick="{{ s.unequip }}" aria-label="Unequip {{ s.name }}">Remove</button>
</sc-if>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ tabPets }}" hint-placeholder-val="{{ false }}">
<div class="lr-scroll" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px">
<sc-if value="{{ petEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px 8px; font-size: 13px; color: #a89a8c; line-height: 1.4; background: #1c1312">No pets yet. Wound a monster below 40% HP (or charm or stun it), stand close and press T to tame it. Elites make stronger pets. Pets level up as you slay foes and learn 3 skills at Lv 1, 3 and 6.</div>
</sc-if>
<sc-for list="{{ pets }}" as="q" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #231716">
<div style="width: 24px; height: 24px; flex: none; color: {{ q.col }}">
<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11z"></path></svg>
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 600; line-height: 1.15; color: {{ q.col }}">{{ q.name }}</div>
<div style="font-size: 12px; color: #d8cbb8; line-height: 1.2">{{ q.lvText }}</div>
<div style="font-size: 12px; color: #a89a8c; line-height: 1.2">{{ q.skills }}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex: none">
<button class="lr-btn" style="min-height: 32px; padding: 0 8px; font-size: 12px" onClick="{{ q.toggle }}">{{ q.actLabel }}</button>
<button class="lr-btn" style="min-height: 32px; padding: 0 8px; font-size: 12px" onClick="{{ q.release }}">Release</button>
</div>
</div>
</sc-for>
</div>
</sc-if>

<sc-if value="{{ tabPack }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 6px">
<div style="flex: 1; font-size: 12px; color: #a89a8c">{{ packCount }} / {{ packMax }} slots</div>
<button class="lr-btn" style="min-height: 30px; padding: 0 10px; font-size: 12px" onClick="{{ sortPack }}" disabled="{{ cantSort }}">Sort all</button>
<button class="lr-btn" style="min-height: 30px; padding: 0 10px; font-size: 12px" onClick="{{ expandPack }}" disabled="{{ cantExpand }}">{{ expandLabel }}</button>
</div>
<div class="lr-scroll" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 2px">
<sc-if value="{{ packEmpty }}" hint-placeholder-val="{{ false }}">
<div style="padding: 12px 8px; font-size: 13px; color: #a89a8c; line-height: 1.4; background: #1c1312">Empty. Enemies drop random gear: the stronger the foe, the better the rarity and affixes. Bosses always drop. Walk over glowing items.</div>
</sc-if>
<sc-for list="{{ pack }}" as="it" hint-placeholder-count="2">
<div data-tip="{{ it.tip }}" style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #231716">
<div style="width: 24px; height: 24px; flex: none; color: {{ it.col }}">
<img src="{{ it.img }}" width="34" height="34" style="display:block" alt="">
</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 14px; font-weight: 600; line-height: 1.15; color: {{ it.col }}">{{ it.name }} <span style="font-size: 12px; font-weight: 400">({{ it.rar }})</span></div>
<div style="font-size: 12px; color: #d8cbb8; line-height: 1.2">{{ it.desc }}</div>
<div style="font-size: 12px; color: #a89a8c; line-height: 1.1">{{ it.meta }}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; flex: none">
<sc-if value="{{ it.canEquip }}" hint-placeholder-val="{{ true }}">
<button class="lr-btn" style="min-height: 32px; padding: 0 8px; font-size: 12px" onClick="{{ it.equip }}">Equip</button>
</sc-if>
<sc-if value="{{ it.locked }}" hint-placeholder-val="{{ false }}">
<button class="lr-btn" style="min-height: 32px; padding: 0 8px; font-size: 12px" disabled="">Locked</button>
</sc-if>
<button class="lr-btn" style="min-height: 32px; padding: 0 8px; font-size: 12px" onClick="{{ it.sell }}">Sell</button>
</div>
</div>
</sc-for>
</div>
</sc-if>

<div style="display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 2px solid #4a2a2a">
<div style="flex: 1; font-size: 14px; line-height: 1.2"><span style="color: #ffd166; font-weight: 700">{{ gold }} gold</span><br><span style="font-size: 12px; color: #a89a8c">{{ potions }} potion(s)</span></div>
<button class="lr-btn" style="padding: 0 10px; font-size: 12px" onClick="{{ buyPotion }}" disabled="{{ cantBuy }}">Buy potion 25g</button>
<button class="lr-btn" style="padding: 0 10px; font-size: 12px" onClick="{{ drinkPotion }}" disabled="{{ cantDrink }}">Drink (Q)</button>
</div>
</div>

<sc-if value="{{ panelOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; left: 0; top: 0; width: 1180px; height: 700px; z-index: 20; display: flex; justify-content: flex-end; background: linear-gradient(90deg, rgba(6,4,5,0.1), rgba(6,4,5,0.72))">
<div style="width: 780px; height: 700px; box-sizing: border-box; background: linear-gradient(180deg, #1b1312, #0f0909); border-left: 2px solid #c9a24a; box-shadow: -18px 0 44px rgba(0,0,0,0.75); display: flex; flex-direction: column; gap: 8px; padding: 10px 16px; animation: lrSlide 0.22s ease-out">

<div style="display: flex; justify-content: space-between; align-items: center">
<div style="font-family: Cinzel, serif; font-size: 24px; font-weight: 700; color: #c9a24a; letter-spacing: 1px; line-height: 1">Pilgrim Knight <span style="font-size: 16px; color: #e9e0d0">· Level {{ level }}</span></div>
<div style="display: flex; gap: 8px">
<button class="lr-btn" style="min-height: 34px; padding: 0 12px; font-size: 13px" onClick="{{ saveNow }}">Save game</button>
<button class="lr-btn" style="min-height: 34px; padding: 0 12px; font-size: 13px" onClick="{{ copySave }}">Copy save code</button>
<button class="lr-btn" style="min-height: 34px; padding: 0 14px; font-size: 13px" onClick="{{ togglePanel }}">Close (Tab)</button>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex; gap: 16px">

<div style="position: relative; width: 380px; height: 590px; flex: none">
<canvas id="lr-doll" width="760" height="1180" style="display: block; width: 380px; height: 590px"></canvas>
<sc-for list="{{ dollS }}" as="s" hint-placeholder-count="9">
<button class="lr-slot" style="position: absolute; left: {{ s.x }}px; top: {{ s.y }}px; width: 64px; height: 64px; padding: 3px; cursor: pointer; background: rgba(20,13,12,0.92); border: 2px solid {{ s.bd }}; box-shadow: {{ s.gl }}; color: {{ s.col }}; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: space-between" onClick="{{ s.pick }}" data-tip="{{ s.tip }}" aria-label="{{ s.label }}">
<img src="{{ s.img }}" width="44" height="44" style="display:block" alt="">
<span style="font-size: 10px; color: #a89a8c; line-height: 1">{{ s.label }}</span>
</button>
</sc-for>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px">
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="8">
<div style="padding: 5px 3px; background: #231716; text-align: center; display: flex; flex-direction: column; gap: 3px">
<div style="font-size: 11px; color: #a89a8c; line-height: 1">{{ s.label }}</div>
<div style="font-size: 15px; font-weight: 700; line-height: 1">{{ s.value }}</div>
</div>
</sc-for>
</div>
<div style="font-size: 11px; color: #ffd89a; line-height: 1.25; padding: 5px 6px; background: #1c1312">{{ skillText }}</div>

<div style="display: flex; justify-content: space-between; align-items: baseline">
<div style="font-size: 11px; color: #a89a8c; line-height: 1">BACKPACK</div>
<div style="display: flex; align-items: center; gap: 6px">
<button class="lr-btn" style="min-height: 26px; padding: 0 8px; font-size: 11px" onClick="{{ sortPack }}" disabled="{{ cantSort }}">Sort</button>
<button class="lr-btn" style="min-height: 26px; padding: 0 8px; font-size: 11px" onClick="{{ expandPack }}" disabled="{{ cantExpand }}">{{ expandLabel }}</button>
<div style="font-size: 11px; color: #a89a8c; line-height: 1">{{ packCount }} / {{ packMax }}</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{ packCells }}" as="q" hint-placeholder-count="16">
<button style="height: 38px; padding: 0; cursor: pointer; background: #1c1312; border: 2px solid {{ q.bd }}; color: {{ q.col }}; display: flex; align-items: center; justify-content: center" onClick="{{ q.pick }}" data-tip="{{ q.tip }}" aria-label="Backpack item">
<img src="{{ q.img }}" width="32" height="32" style="display:block" alt="">
</button>
</sc-for>
</div>

<div style="flex: 1; min-height: 0; background: #1c1312; border: 2px solid #3a2a28; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto" class="lr-scroll">
<sc-if value="{{ detNone }}" hint-placeholder-val="{{ false }}">
<div style="font-size: 12px; color: #a89a8c; line-height: 1.4">Click a slot beside your knight, or a backpack item, to inspect it. Equip an item and it appears on the body: cloth, leather, mail, plate and dusk mantles each change the armor, helm, shield and boots.</div>
</sc-if>
<sc-if value="{{ dt_has }}" hint-placeholder-val="{{ true }}">
<div style="font-size: 16px; font-weight: 700; line-height: 1.15; color: {{ dt_col }}">{{ dt_name }}</div>
<div style="font-size: 11px; color: #a89a8c; line-height: 1.1">{{ dt_rar }} · {{ dt_slot }}</div>
<div style="font-size: 12px; color: #e9e0d0; line-height: 1.35">{{ dt_desc }}</div>
<div style="font-size: 11px; color: #a89a8c; line-height: 1.2">{{ dt_meta }}</div>
<div style="display: flex; gap: 8px; margin-top: 2px; flex-wrap: wrap">
<sc-if value="{{ dt_canEquip }}" hint-placeholder-val="{{ true }}"><button class="lr-btn" style="min-height: 34px; font-size: 13px" onClick="{{ dt_equip }}">Equip</button></sc-if>
<sc-if value="{{ dt_locked }}" hint-placeholder-val="{{ false }}"><button class="lr-btn" style="min-height: 34px; font-size: 13px" disabled="">Needs Lv {{ dt_req }}</button></sc-if>
<sc-if value="{{ dt_isEq }}" hint-placeholder-val="{{ false }}"><button class="lr-btn" style="min-height: 34px; font-size: 13px" onClick="{{ dt_unequip }}">Unequip</button></sc-if>
<sc-if value="{{ dt_isPack }}" hint-placeholder-val="{{ true }}"><button class="lr-btn" style="min-height: 34px; font-size: 13px" onClick="{{ dt_sell }}">Sell</button></sc-if>
</div>
</sc-if>
</div>
</div>

</div>
</div>
</div>
</sc-if>

</div>

// Room builder. Tile chars: # stone, = one-way platform, ^ spikes, B breakable wall, r red door,
// c candle, S altar, K key, W wing sigil, H heart, C chest, e/b/s enemies, X boss, 1-9 doors.
function mk(id, name, w, h, theme, mx, my, tier) {
  const g = [];
  for (let r = 0; r < h; r++) g.push(new Array(w).fill('.'));
  const R = { id, name, w, h, base: g, theme, mx, my, tier, doors: {} };
  R.box = (x, y, bw, bh, ch) => { for (let r = y; r < y + bh; r++) for (let c = x; c < x + bw; c++) if (r >= 0 && r < h && c >= 0 && c < w) g[r][c] = ch; };
  R.put = (c, r, ch) => { if (r >= 0 && r < h && c >= 0 && c < w) g[r][c] = ch; };
  R.door = (ch, side, row, col) => { const c = side === 'L' ? 0 : side === 'R' ? w - 1 : col; R.put(c, row, ch); R.put(c, row + 1, ch); };
  R.terrain = (c0, sv) => {
    const B = h - 2;
    for (let i = 0; i + 1 < sv.length; i++) {
      const c = c0 + i, a = sv[i], b2 = sv[i + 1];
      if (b2 === a) { for (let r = B - a; r < B; r++) g[r][c] = '#'; }
      else if (b2 > a) { g[B - b2][c] = '/'; for (let r = B - b2 + 1; r < B; r++) g[r][c] = '#'; }
      else { g[B - a][c] = '\\'; for (let r = B - a + 1; r < B; r++) g[r][c] = '#'; }
    }
  };
  R.fit = () => {
    const fr = c => { for (let r = 4; r < h; r++) { const t = g[r][c]; if (t === '#' || t === '/' || t === '\\') return r; } return h; };
    for (let c = 1; c < w - 1; c++) for (let r = 2; r < h - 2; r++) {
      const t = g[r][c];
      if ('fzqcSCHKahklmno'.indexOf(t) >= 0) { const f = fr(c); if (r >= f) { const nr = f - 1; if (nr >= 2 && g[nr][c] === '.') { g[r][c] = '.'; g[nr][c] = t; } } }
    }
  };
  R.many = (ch, row, cols) => { cols.forEach(c => R.put(c, row, ch)); };
  R.box(0, 0, w, 2, '#'); R.box(0, 0, 1, h, '#'); R.box(w - 1, 0, 1, h, '#'); R.box(0, h - 2, w, 2, '#');
  return R;
}

function doorSpawn(R, ch) {
  let c0 = -1, r1 = -1;
  if (!R.base.some(row => row.indexOf(ch) >= 0)) ch = '1';
  for (let r = 0; r < R.h; r++) for (let c = 0; c < R.w; c++) if (R.base[r][c] === ch) { if (c0 < 0) c0 = c; if (r > r1) r1 = r; }
  const x = c0 === 0 ? T + 4 : c0 === R.w - 1 ? c0 * T - 26 : c0 * T + 5;
  return { x, y: (r1 + 1) * T - 34, face: c0 === R.w - 1 ? -1 : 1 };
}
function safeSpawn(R, ch) {
  for (let r = 0; r < R.h; r++) for (let c = 0; c < R.w; c++) if (R.base[r][c] === ch) return doorSpawn(R, ch);
  return doorSpawn(R, '1');
}

  installTip() {
    if (window.__lrTip) return; window.__lrTip = true;
    const tip = document.createElement('div');
    tip.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;display:none;max-width:290px;padding:9px 11px;background:rgba(14,9,10,0.97);border:2px solid #6a4a2a;box-shadow:0 6px 22px rgba(0,0,0,0.7);font:13px/1.35 "Noto Sans",system-ui,sans-serif;color:#d8cbb8';
    document.body.appendChild(tip);
    const esc = (t) => String(t).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    let cur = null;
    const find = (e) => { const path = e.composedPath ? e.composedPath() : [e.target]; for (const el of path) if (el && el.getAttribute && el.getAttribute('data-tip')) return el; return null; };
    const place = (e) => { const w = tip.offsetWidth, h = tip.offsetHeight; let x = e.clientX + 16, y = e.clientY + 14; if (x + w > window.innerWidth - 6) x = e.clientX - w - 14; if (y + h > window.innerHeight - 6) y = window.innerHeight - h - 6; tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px'; };
    const show = (el, e) => {
      let d; try { d = JSON.parse(el.getAttribute('data-tip')); } catch (er) { d = null; }
      if (!d) { tip.style.display = 'none'; return; }
      tip.innerHTML = '<div style="font-size:15px;font-weight:700;color:' + d.c + '">' + esc(d.n) + '</div><div style="font-size:11px;color:#a89a8c;margin-bottom:5px">' + esc(d.h) + '</div>'
        + d.l.map((l) => '<div style="' + (l.charAt(0) === '\u2605' ? 'color:#ffd89a' : 'color:#e8dccb') + '">' + esc(l) + '</div>').join('')
        + '<div style="margin-top:6px;font-size:12px;color:' + (d.x.charAt(0) === '\u25B2' ? '#7be08f' : d.x.charAt(0) === '\u25BC' ? '#e8808a' : '#a89a8c') + '">' + esc(d.x) + '</div>'
        + '<div style="font-size:11px;color:' + (d.m.indexOf('too high') > 0 ? '#e8808a' : '#a89a8c') + '">' + esc(d.m) + ' \u00B7 ' + esc(d.g) + '</div>';

    document.addEventListener('keydown', () => { tip.style.display = 'none'; cur = null; }, true);
  }
